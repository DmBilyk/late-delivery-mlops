# Database settings come from .env (see .env.example); the defaults are for the local postgres container.
# DB_HOST, DB_USER, DB_PASSWORD, DB_SSLMODE are shared by mlflow, airflow, api and grafana.

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ml
      POSTGRES_USER: ${DB_USER:-ml}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ml}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First start only: extra databases, then tables and views in `ml`
      - ./docker/postgres/10-databases.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/20-schema.sql:ro
      - ./sql/views.sql:/docker-entrypoint-initdb.d/30-views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ml"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    build: docker/mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --workers 1
      --backend-store-uri postgresql+psycopg://${DB_USER:-ml}:${DB_PASSWORD:-ml}@${DB_HOST:-postgres}:5432/mlflow?sslmode=${DB_SSLMODE:-disable}
      --artifacts-destination ${MLFLOW_ARTIFACTS:-/mlartifacts}
      --allowed-hosts mlflow,mlflow:5000,localhost,localhost:5001,127.0.0.1,127.0.0.1:5001
    environment:
      # Background job runner is for GenAI features we don't use; it costs ~1.4 GB of RAM
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlartifacts:/mlartifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    command: standalone
    restart: unless-stopped
    environment:
      # Airflow itself: metadata in the `airflow` database, tasks run as local processes
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-ml}:${DB_PASSWORD:-ml}@${DB_HOST:-postgres}:5432/airflow?sslmode=${DB_SSLMODE:-disable}
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      # No login locally: the port is bound to 127.0.0.1 (on EC2: SSH tunnel only)
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      # Our tasks: where the project, MLflow and the `ml` database are
      PROJECT_DIR: /opt/project
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://${DB_USER:-ml}:${DB_PASSWORD:-ml}@${DB_HOST:-postgres}:5432/ml?sslmode=${DB_SSLMODE:-disable}
      # Empty locally: predictions stay in ./predictions only
      PREDICTIONS_BUCKET: ${PREDICTIONS_BUCKET:-}
      AWS_DEFAULT_REGION: ${AWS_REGION:-eu-central-1}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      # Whole project read-only (a single-file mount goes stale after edits), data folders writable
      - .:/opt/project:ro
      - ./batches:/opt/project/batches
      - ./labels:/opt/project/labels
      - ./predictions:/opt/project/predictions
      - airflow-logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 20

  api:
    build: .
    command: uvicorn src.api:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATABASE_URL: postgresql://${DB_USER:-ml}:${DB_PASSWORD:-ml}@${DB_HOST:-postgres}:5432/ml?sslmode=${DB_SSLMODE:-disable}
    ports:
      - "127.0.0.1:8000:8000"
    # Not on postgres: the API must start and answer 503 when the database is down
    depends_on:
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Used by provisioning/datasources/ml.yaml
      ML_DB_HOST: ${DB_HOST:-postgres}:5432
      ML_DB_USER: ${DB_USER:-ml}
      ML_DB_PASSWORD: ${DB_PASSWORD:-ml}
      ML_DB_SSLMODE: ${DB_SSLMODE:-disable}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # Datasource, dashboards and alerts live in the repo; the volume keeps only runtime state
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  mlartifacts:
  airflow-logs:
  grafana-data:
