# EC2 overrides: databases live in RDS, so the postgres container is not started.



services:
  postgres:
    profiles: ["local-db"]

  mlflow:
    depends_on: !reset {}
    environment:
      MLFLOW_S3_ENDPOINT_URL: https://s3.${AWS_REGION}.amazonaws.com

  airflow:
    depends_on: !override
      mlflow:
        condition: service_healthy

  grafana:
    depends_on: !reset {}
